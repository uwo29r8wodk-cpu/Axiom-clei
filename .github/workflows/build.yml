name: Build Axiom Client
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: unzip axiom-client.zip && cd axiom-client && chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v3
        with:
          name: axiom-client-jar
          path: axiom-client/build/libs/*.jar
